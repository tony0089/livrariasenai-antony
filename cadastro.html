<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Senai - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Livraria Senai</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="simulador.html">Simulador</a></li>
        <li><a href="cadastro.html" class="ativo">Cadastro</a></li>
        <li><a href="sobre.html">Sobre e dúvidas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Cadastro de leitor</h2>
    <p>Preencha os dados abaixo para receber as novidades da livraria.</p>

    <section class="caixa">
      <form id="form-cadastro" novalidate>
        <p>
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome">
        </p>
        <p>
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email">
        </p>
        <p>
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha">
        </p>
        <p>
          <label for="idade">Idade:</label>
          <input type="number" id="idade" name="idade">
        </p>
        <p>
          <label for="genero">Gênero favorito:</label>
          <select id="genero" name="genero">
            <option value="">Escolha...</option>
            <option value="Romance">Romance</option>
            <option value="Fantasia">Fantasia</option>
            <option value="Didático">Didático</option>
            <option value="Tecnologia">Tecnologia</option>
          </select>
        </p>
        <p>
          <label for="mensagem">Mensagem (opcional):</label>
          <textarea id="mensagem" name="mensagem" rows="3"></textarea>
        </p>
        <button type="submit" class="botao">Cadastrar</button>
      </form>

      <div id="mensagem-form" class="resultado"></div>
    </section>
  </main>

  <footer>
     <p>Livraria Senai - Aluno: Antony Almir Guedes do Monte</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
